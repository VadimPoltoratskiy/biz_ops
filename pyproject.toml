[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3,<2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
compliance-agent = "compliance_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = ["pytest>=8.0"]
